<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? ❤️</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Quicksand & Pacifico for a cute, romantic vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Fonts and Base Animations */
        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; /* Prevent scrollbars when hearts rain or button moves */
            user-select: none;
            -webkit-user-select: none;
        }

        .font-romantic {
            font-family: 'Pacifico', cursive;
        }

        /* Subtle background floating hearts */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(8deg); }
        }

        .animate-float-slow {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* Heartbeat animation for the main icon and Yes button */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.12); }
            30% { transform: scale(1); }
            45% { transform: scale(1.12); }
            60% { transform: scale(1); }
        }

        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        /* Falling elements animation */
        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Floating text rain animation (less rotation for readability) */
        @keyframes fallText {
            0% {
                transform: translateY(-10vh) rotate(-5deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(5deg);
                opacity: 0;
            }
        }

        .falling-heart {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 40;
            animation: fallDown linear forwards;
        }

        .falling-text {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 45;
            animation: fallText linear forwards;
            white-space: nowrap;
        }

        /* Smooth transition for the dodging No button */
        #noBtn {
            transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease;
        }

        /* Modal pop-in animation */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-100 to-red-100 min-h-screen w-screen flex items-center justify-center relative">

    <!-- Decorative Background Floating Hearts -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden opacity-40">
        <div class="absolute top-10 left-10 text-4xl animate-float-slow" style="animation-delay: 0s;">💕</div>
        <div class="absolute top-1/4 right-12 text-5xl animate-float-slow" style="animation-delay: 1s;">🌸</div>
        <div class="absolute bottom-16 left-1/4 text-4xl animate-float-slow" style="animation-delay: 2s;">💖</div>
        <div class="absolute bottom-20 right-1/4 text-5xl animate-float-slow" style="animation-delay: 0.5s;">💗</div>
        <div class="absolute top-1/2 left-8 text-3xl animate-float-slow" style="animation-delay: 1.5s;">✨</div>
    </div>

    <!-- Container for Raining Hearts and Messages -->
    <div id="rainContainer" class="fixed inset-0 pointer-events-none overflow-hidden z-40"></div>

    <!-- Main Question Card -->
    <main id="questionCard" class="relative z-20 bg-white/85 backdrop-blur-md border-2 border-pink-200 shadow-2xl shadow-rose-200/60 rounded-3xl p-8 sm:p-12 max-w-md w-[90%] text-center transition-all duration-500">
        
        <!-- Cute Animated SVG Bear/Heart Illustration -->
        <div class="w-28 h-28 mx-auto mb-6 bg-rose-50 rounded-full flex items-center justify-center shadow-inner border border-pink-100 animate-heartbeat">
            <svg class="w-16 h-16 text-rose-500 drop-shadow-sm" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Question Heading -->
        <h1 class="font-romantic text-4xl sm:text-5xl text-rose-600 mb-3 tracking-wide drop-shadow-sm">
            Do you love me?
        </h1>
        
        <!-- Playful Dynamic Subtitle -->
        <p id="subText" class="text-rose-400 font-semibold text-base sm:text-lg mb-8 min-h-[28px] transition-all duration-300">
            Be honest... 🥺👉👈
        </p>

        <!-- Action Buttons Area -->
        <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 min-h-[64px]">
            <!-- YES Button -->
            <button id="yesBtn" 
                class="bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 active:scale-95 text-white font-bold text-lg sm:text-xl px-8 py-3.5 rounded-full shadow-lg shadow-rose-300/80 hover:shadow-xl hover:shadow-rose-400/80 transition-all duration-200 cursor-pointer z-30">
                Yes! 💖
            </button>

            <!-- NO Button (Will move around on hover/touch) -->
            <button id="noBtn" 
                class="bg-white hover:bg-gray-50 text-rose-400 border-2 border-rose-200 font-bold text-lg sm:text-xl px-8 py-3.5 rounded-full shadow-md cursor-pointer z-30">
                No 😢
            </button>
        </div>
    </main>

    <!-- Celebration Popup Modal (Hidden Initially) -->
    <div id="celebrationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-rose-950/30 backdrop-blur-sm p-4">
        <div class="bg-white/95 border-4 border-pink-300 rounded-3xl p-8 sm:p-10 max-w-md w-full text-center shadow-2xl shadow-rose-500/30 animate-pop-in relative overflow-hidden">
            
            <!-- Top Decorative Ribbon/Glow -->
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-pink-200 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-rose-200 rounded-full blur-2xl opacity-60 pointer-events-none"></div>

            <!-- Big Celebration Icon -->
            <div class="text-6xl sm:text-7xl mb-4 animate-bounce">
                😂👃💖
            </div>

            <!-- Main Popup Title -->
            <h2 class="font-romantic text-4xl sm:text-5xl text-rose-600 mb-4">
                Baho ng ilong mo!
            </h2>

            <!-- Sweet Romantic Note -->
            <p class="text-gray-700 font-medium text-base sm:text-lg leading-relaxed mb-6">
                Baho ng ilong mo! 😂 Pero kahit mabaho 'yan, love pa rin kita! ✨🌹
            </p>

            <!-- Cute Badge -->
            <div class="inline-block bg-rose-100 text-rose-600 font-bold text-sm px-5 py-2 rounded-full border border-rose-200 mb-6">
                ❤️ Baho ng ilong mo ❤️
            </div>

            <!-- Optional Replay Button -->
            <div>
                <button id="replayBtn" class="text-sm font-semibold text-rose-400 hover:text-rose-600 underline decoration-pink-300 underline-offset-4 transition-colors cursor-pointer">
                    Ask me again ↺
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const subText = document.getElementById('subText');
        const questionCard = document.getElementById('questionCard');
        const celebrationModal = document.getElementById('celebrationModal');
        const rainContainer = document.getElementById('rainContainer');
        const replayBtn = document.getElementById('replayBtn');

        // State Variables
        let dodgeCount = 0;
        let yesScale = 1;
        let rainInterval = null;

        // Playful messages when the user tries to click "No"
        const pleadingMessages = [
            "Are you sure? 🥺",
            "Think again! 💭",
            "Nice try, too slow! 😜",
            "You can't catch me! 🏃‍♂️💨",
            "My heart says click Yes! 💓",
            "Error 404: 'No' not found! 🚫",
            "Pretty please with a cherry on top? 🍒",
            "Just press the pink button! 💖",
            "I'll give you unlimited hugs! 🤗",
            "Resistance is futile! 🥰"
        ];

        // Hearts & Romantic Messages for the Rain Effect
        const heartEmojis = ['❤️', '💖', '💗', '💓', '💕', '💞', '💘', '🌹', '✨', '😂'];
        const loveMessages = [
            "baho ng ilong mo 😂",
            "baho ng ilong mo! 💕",
            "baho ng ilong mo 💖",
            "baho ng ilong mo 🥰",
            "baho ng ilong mo ✨",
            "baho ng ilong mo 👃",
            "baho ng ilong mo ❤️"
        ];

        /**
         * Moves the "No" button to a random safe position inside the viewport
         * so it stays visible on screen but cannot be clicked.
         */
        function dodgeNoButton(e) {
            if (e) {
                e.preventDefault(); // Prevent accidental tap on mobile
            }

            // Switch button to fixed positioning on the first dodge so it can roam the whole screen
            if (noBtn.style.position !== 'fixed') {
                const rect = noBtn.getBoundingClientRect();
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${rect.left}px`;
                noBtn.style.top = `${rect.top}px`;
            }

            // Get viewport dimensions and button size
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnRect = noBtn.getBoundingClientRect();
            const btnWidth = btnRect.width || 110;
            const btnHeight = btnRect.height || 52;

            // Safe padding from screen edges (prevents going off-screen on mobile)
            const padding = 20;
            const maxX = Math.max(padding, viewportWidth - btnWidth - padding);
            const maxY = Math.max(padding, viewportHeight - btnHeight - padding);

            // Generate a new random position away from the current spot
            let newX, newY;
            let attempts = 0;
            do {
                newX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
                newY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;
                attempts++;
            } while (
                Math.hypot(newX - btnRect.left, newY - btnRect.top) < 100 && 
                attempts < 10
            );

            // Apply new position and slight playful tilt
            const randomRotate = (Math.random() * 20 - 10).toFixed(1);
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
            noBtn.style.transform = `rotate(${randomRotate}deg)`;

            // Update pleading subtitle text
            subText.textContent = pleadingMessages[dodgeCount % pleadingMessages.length];
            dodgeCount++;

            // Slightly grow the "Yes" button each time to make it more irresistible (capped at 1.45x)
            if (yesScale < 1.45) {
                yesScale += 0.05;
                yesBtn.style.transform = `scale(${yesScale})`;
            }
        }

        // Attach Desktop & Mobile Dodge Listeners to the "No" Button
        noBtn.addEventListener('mouseover', dodgeNoButton);
        noBtn.addEventListener('touchstart', dodgeNoButton, { passive: false });
        noBtn.addEventListener('click', dodgeNoButton);

        /**
         * Creates a single falling heart or "I love you" badge
         */
        function spawnRainElement() {
            const isMessage = Math.random() < 0.35; // 35% chance for text message, 65% for heart
            const el = document.createElement('div');

            // Random horizontal position across screen
            const startX = Math.random() * 92; // 0vw to 92vw
            // Random fall duration between 3s and 6s
            const duration = 3 + Math.random() * 3;

            el.style.left = `${startX}vw`;
            el.style.animationDuration = `${duration}s`;

            if (isMessage) {
                el.className = 'falling-text bg-white/90 text-rose-600 font-bold text-xs sm:text-sm px-3.5 py-1.5 rounded-full shadow-md border border-pink-200';
                el.textContent = loveMessages[Math.floor(Math.random() * loveMessages.length)];
            } else {
                el.className = 'falling-heart';
                const size = 18 + Math.floor(Math.random() * 24); // 18px to 42px
                el.style.fontSize = `${size}px`;
                el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            }

            rainContainer.appendChild(el);

            // Clean up DOM element once animation finishes
            setTimeout(() => {
                if (el.parentNode) {
                    el.remove();
                }
            }, duration * 1000 + 200);
        }

        /**
         * Starts continuous rain of hearts and love messages
         */
        function startLoveRain() {
            // Burst of initial hearts immediately
            for (let i = 0; i < 20; i++) {
                setTimeout(spawnRainElement, i * 80);
            }

            // Continuous gentle stream
            if (!rainInterval) {
                rainInterval = setInterval(spawnRainElement, 180);
            }
        }

        /**
         * Handles clicking the "Yes" button
         */
        yesBtn.addEventListener('click', () => {
            // Hide the dodging No button
            noBtn.style.display = 'none';
            
            // Show the romantic popup modal
            celebrationModal.classList.remove('hidden');
            celebrationModal.classList.add('flex');

            // Trigger raining hearts and messages
            startLoveRain();
        });

        /**
         * Resets the experience if the user clicks "Ask me again"
         */
        replayBtn.addEventListener('click', () => {
            // Hide modal
            celebrationModal.classList.add('hidden');
            celebrationModal.classList.remove('flex');

            // Stop rain and clear existing falling items
            clearInterval(rainInterval);
            rainInterval = null;
            rainContainer.innerHTML = '';

            // Reset buttons and text
            dodgeCount = 0;
            yesScale = 1;
            yesBtn.style.transform = 'scale(1)';
            subText.textContent = "Be honest... 🥺👉👈";

            noBtn.style.display = 'inline-block';
            noBtn.style.position = 'static';
            noBtn.style.transform = 'none';
        });

        // Keep "No" button inside bounds if window resizes while dodging
        window.addEventListener('resize', () => {
            if (noBtn.style.position === 'fixed' && noBtn.style.display !== 'none') {
                dodgeNoButton();
            }
        });
    </script>
</body>
</html>
